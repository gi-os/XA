name: Check

# Compiles and tests without publishing anything. A push to main ships to TestFlight, so
# main is a bad place to find out something doesn't compile. Every other branch runs this:
# the same build and tests, unsigned, with no upload.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The Xcode 27 image: Xcode 27.1 is the first that builds for iPhone Duo's full screens.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: bash ci/select-xcode.sh
      - name: Generate project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Unit tests
        run: bash ci/test.sh
      - name: Compile for device (unsigned)
        run: bash ci/build-unsigned.sh
