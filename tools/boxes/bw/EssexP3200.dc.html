class Component extends DCLogic {
  renderVals() {
    const BOX = 3200, EXP = 36, P = 'es', X = 130, Y = 312, SIZE = 136, MAXW = 320, LS = 0, MIN = -2, MAX = 1;
    const ADV = { 0: .495, 1: .452, 2: .489, 3: .493, 4: .487, 5: .494, 6: .495, 7: .464, 8: .487, 9: .495 };
    const SPEEDS = [25, 32, 40, 50, 64, 80, 100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400];
    const n = (this.state && this.state.n) || 0;
    const at = (k) => BOX * Math.pow(2, k);
    const ok = (k) => k >= MIN && k <= MAX && SPEEDS.indexOf(at(k)) >= 0;
    // DX CAS tops out at 5000; 6400 reads as the top code
    const ei = at(n), i = Math.min(SPEEDS.indexOf(ei), 23), g = Math.floor(i / 3), t = i % 3;
