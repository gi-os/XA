><path d="M600 0L660 92" stroke="#3b3b3e" stroke-width="1.6"></path><path d="M622 0L682 92" stroke="#3b3b3e" stroke-width="1.6"></path><path d="M644 0L704 92" stroke="#3b3b3e" stroke-width="1.6"></path></g>

</g>
<text x="612" y="318" text-anchor="end" font-size="34" fill="#f2f0eb" style="font-family: Archivo, sans-serif; font-weight: 800; font-variation-settings: 'wdth' 100;">36</text>
<text x="612" y="336" text-anchor="end" font-size="14" fill="#f2f0eb" style="font-family: Archivo, sans-serif; font-weight: 700; font-variation-settings: 'wdth' 100; letter-spacing: 2px;">EXP</text>
<rect x="0" y="352" width="640" height="2" fill="#b0302a"></rect>

<rect x="3" y="413.5" width="103" height="8.5" rx="1.5" fill="{{dx.b1}}"></rect>
<rect x="109" y="413.5" width="103" height="8.5" rx="1.5" fill="{{dx.b2}}"></rect>
<rect x="215" y="413.5" width="103" height="8.5" rx="1.5" fill="{{dx.b3}}"></rect>
<rect x="321" y="413.5" width="103" height="8.5" rx="1.5" fill="{{dx.b4}}"></rect>
<rect x="427" y="413.5" width="103" height="8.5" rx="1.5" fill="{{dx.b5}}"></rect>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px;">
<button type="button" onClick="{{pull}}" disabled="{{noPull}}" aria-label="Pull one stop" style="flex: none; width: 48px; height: 44px; border: 0; border-radius: 2px; background: #1f1f1f; color: #f4f1ea; font-size: 22px; line-height: 1; cursor: pointer; opacity: {{pullOp}};">–</button>
<div aria-live="polite" style="font-size: 16px; text-align: center; white-space: nowrap;"><span style="color: #f4f1ea;">EI {{ei}}</span> <span style="color: #9c978e;">{{mode}}</span></div>
<button type="button" onClick="{{push}}" disabled="{{noPush}}" aria-label="Push one stop" style="flex: none; width: 48px; height: 44px; border: 0; border-radius: 2px; background: #1f1f1f; color: #f4f1ea; font-size: 22px; line-height: 1; cursor: pointer; opacity: {{pushOp}};">+</button>
</div>
<p style="margin: 14px 0 0; font-size: 13px; line-height: 1.25; color: #9c978e;">DELANCEY 3200 · Delta 3200 datasheet</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const BOX = 3200, EXP = 36, P = 'dl', X = 24, Y = 330, SIZE = 124, MAXW = 226, LS = 0, MIN = -2, MAX = 1;
    const ADV = { 0: .625, 1: .625, 2: .625, 3: .625, 4: .626, 5: .625, 6: .625, 7: .625, 8: .625, 9: .625 };
    const SPEEDS = [25, 32, 40, 50, 64, 80, 100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400];
    const n = (this.state && this.state.n) || 0;
    const at = (k) => BOX * Math.pow(2, k);
    const ok = (k) => k >= MIN && k <= MAX && SPEEDS.indexOf(at(k)) >= 0;
    // DX CAS tops out at 5000; 6400 reads as the top code
    const ei = at(n), i = Math.min(SPEEDS.indexOf(ei), 23), g = Math.floor(i / 3), t = i % 3;
    const r1 = [1, g & 1, (g >> 1) & 1, (g >> 2) & 1, t === 1 ? 0 : 1, t === 0 ? 0 : 1];
    const r2 = [1].concat({ 12: [1, 0, 0], 20: [0, 1, 0], 24: [1, 1, 0], 36: [0, 0, 1] }[EXP], [1, 1]);
    const c = (b) => (b ? 'url(#' + P + '-metal)' : '#26262b');
    const digits = String(ei);
    let wNum = 0;
    for (const d of digits) wNum += ADV[d] * SIZE + LS;
    const s = Math.min(1, MAXW / wNum);
    return {
      ei: digits,
      fit: 'translate(' + X + ' ' + Y + ') scale(' + s.toFixed(4) + ') translate(' + -X + ' ' + -Y + ')',
      dx: { a1: c(r1[0]), a2: c(r1[1]), a3: c(r1[2]), a4: c(r1[3]), a5: c(r1[4]), a6: c(r1[5]), b1: c(r2[0]), b2: c(r2[1]), b3: c(r2[2]), b4: c(r2[3]), b5: c(r2[4]), b6: c(r2[5]) },
      tape: { op: n ? 1 : 0, fill: n > 0 ? '#f0e4c4' : '#a9d6f2', text: n > 0 ? 'PUSH +' + n : 'PULL −' + -n },
      mode: n === 0 ? 'box speed' : n > 0 ? 'push +' + n : 'pull −' + -n,
      pull: () => { if (ok(n - 1)) this.setState({ n: n - 1 }); },
      push: () => { if (ok(n + 1)) this.setState({ n: n + 1 }); },
      noPull: !ok(n - 1), noPush: !ok(n + 1),
      pullOp: ok(n - 1) ? 1 : 0.35, pushOp: ok(n + 1) ? 1 : 0.35
    };
  }
}
</script>
</body>
</html>
