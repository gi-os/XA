name: XA
options:
  bundleIdPrefix: com.gios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Frozen while testing: TestFlight reviews only the first build of a version, so every build
    # keeps this number and only the build number (the CI run number) goes up.
    MARKETING_VERSION: "0.15.3"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  XA:
    type: application
    platform: iOS
    sources:
      - path: XA
      - path: Shared
    dependencies:
      - target: XACapture
        embed: true
      - target: XAControl
        embed: true
    info:
      path: XA/Info.plist
      properties:
        CFBundleDisplayName: XA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: XA is a camera. It needs the camera to take pictures.
        NSMicrophoneUsageDescription: XA records sound with your videos.
        NSPhotoLibraryAddUsageDescription: XA saves your pictures to the XA album in Photos.
        NSPhotoLibraryUsageDescription: XA shows the pictures in its album as a contact sheet.
        NSUserActivityTypes:
          - NSUserActivityTypeLockedCameraCapture
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - Anton-400.ttf
          - Archivo-800.ttf
          - PermanentMarker-400.ttf
          - BebasNeue-400.ttf
          - Bungee-400.ttf
          - Caveat-700.ttf
          - ChakraPetch-600.ttf
          - ChakraPetch-700.ttf
          - CormorantGaramond-500.ttf
          - CormorantGaramond-700.ttf
          - DMSerifDisplay-400.ttf
          - Fredoka-700.ttf
          - IBMPlexSansCondensed-700.ttf
          - MochiyPopOne-400.ttf
          - Nunito-900.ttf
          - Orbitron-800.ttf
          - Oxanium-800.ttf
          - PressStart2P-400.ttf
          - RacingSansOne-400.ttf
          - Righteous-400.ttf
          - RobotoCondensed-700.ttf
          - SairaExtraCondensed-600.ttf
          - RussoOne-400.ttf
          - ShareTechMono-400.ttf
          - Silkscreen-400.ttf
          - SpaceMono-700.ttf
          - Unbounded-800.ttf
          - Yellowtail-400.ttf
        # The camera stays upright like the system camera (AppDelegate holds it portrait); only
        # the photo viewer turns with the phone. See XA/App/Orientation.swift.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.xa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  XACapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Capture
      - path: Shared
      - path: XA/Camera
      - path: XA/Film
      - path: XA/UI/PreviewView.swift
      - path: XA/UI/Theme.swift
      - path: XA/UI/StackRow.swift
      - path: XA/UI/CameraView.swift
      - path: XA/UI/LCD.swift
      - path: XA/UI/Collar.swift
      - path: XA/UI/ProPanel.swift
      - path: XA/Resources/Stocks
        buildPhase: resources
      - path: XA/Resources/Boxes
        buildPhase: resources
      - path: XA/Resources/Fonts
        buildPhase: resources
    info:
      path: Capture/Info.plist
      properties:
        CFBundleDisplayName: XA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: XA is a camera. It needs the camera to take pictures.
        NSMicrophoneUsageDescription: XA records sound with your videos.
        NSPhotoLibraryAddUsageDescription: XA saves your pictures to the XA album in Photos.
        NSPhotoLibraryUsageDescription: XA shows the pictures in its album as a contact sheet.
        UIAppFonts:
          - Anton-400.ttf
          - Archivo-800.ttf
          - PermanentMarker-400.ttf
          - BebasNeue-400.ttf
          - Bungee-400.ttf
          - Caveat-700.ttf
          - ChakraPetch-600.ttf
          - ChakraPetch-700.ttf
          - CormorantGaramond-500.ttf
          - CormorantGaramond-700.ttf
          - DMSerifDisplay-400.ttf
          - Fredoka-700.ttf
          - IBMPlexSansCondensed-700.ttf
          - MochiyPopOne-400.ttf
          - Nunito-900.ttf
          - Orbitron-800.ttf
          - Oxanium-800.ttf
          - PressStart2P-400.ttf
          - RacingSansOne-400.ttf
          - Righteous-400.ttf
          - RobotoCondensed-700.ttf
          - SairaExtraCondensed-600.ttf
          - RussoOne-400.ttf
          - ShareTechMono-400.ttf
          - Silkscreen-400.ttf
          - SpaceMono-700.ttf
          - Unbounded-800.ttf
          - Yellowtail-400.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.xa.capture
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CAPTURE_EXTENSION
  XAControl:
    type: app-extension
    platform: iOS
    sources:
      - path: Control
      - path: Shared
    info:
      path: Control/Info.plist
      properties:
        CFBundleDisplayName: XA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.xa.control
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  XATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XATests
    dependencies:
      - target: XA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.xa.tests
schemes:
  XA:
    build:
      targets:
        XA: all
        XATests: [test]
    test:
      targets:
        - XATests
